<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1216">
<title>Dakar Studio - Studio de Production</title>
<style>
  :root { --bg:#0f1216; --card:#1a1f26; --fg:#e8ecf1; --muted:#8a93a0;
          --accent:#ff8a3d; --ok:#2fbf71; --line:#252b33; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0 auto; padding:16px 12px 40px; max-width:720px;
         font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:16px; border: 1px solid var(--line); }
  .header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .title { font-size: 16px; font-weight: bold; }
  .lieu { color:var(--muted); font-size:13px; font-weight: normal; margin-top: 2px;}
  
  .section-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 16px 0 6px; font-weight: 600; }
  .prompt-box { background: #0b0e12; border: 1px solid #2a313b; border-radius: 8px; padding: 12px; position: relative; font-family: ui-monospace,monospace; font-size: 13px; line-height: 1.5; color: #c8d1de; }
  .btn-copy { position: absolute; top: 8px; right: 8px; background: #2a313b; border: 0; color: var(--fg); padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
  .btn-copy:active { background: var(--accent); color: #111; }
  
  .dialogue-box { background: #1a2a1f; border: 1px solid #2fbf71; border-radius: 8px; padding: 12px; color: #e8ecf1; font-size: 14px; position: relative; }
  .dialogue-box .btn-copy { background: #2fbf71; color: #111; }
  
  .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line); cursor: pointer; }
  .checkbox-row input { width: 20px; height: 20px; accent-color: var(--accent); }
  .checkbox-row span { font-weight: 600; font-size: 14px; }
  .is-done { opacity: 0.5; }
  .is-done .title { text-decoration: line-through; }
  
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ok); color: #111; padding: 10px 20px; border-radius: 999px; font-weight: bold; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100; }
</style>
</head>
<body>
<header>
  <h1>🎬 Dakar Studio</h1>
  <div class="sub">Tableau de production · Épisode 1 · Le Port</div>
</header>

<section id="shots"></section>

<div id="toast" class="toast">Copié !</div>

<script>
// --- DONNÉES ---
const STYLE = "STYLE: Stylized 3D animated render, cinematic action-film look with expressive faces, soft volumetric lighting and shallow depth of field. Warm Dakar palette of sunset orange, teal shadows and deep indigo night, vertical 9:16 framing.";
const PERSOS = {
  MOUSSA:"Moussa, a 45-year-old Senegalese man, broad shoulders, short grey-flecked beard, small scar over left eyebrow, wearing a worn olive jacket over a white t-shirt and dark jeans.",
  AICHA:"Aicha, a 26-year-old Senegalese woman, oval face, braided hair in a high bun, round glasses, wearing a mustard-yellow jacket with a camera strap across her chest.",
  BAMBA:"Bamba, a 19-year-old Senegalese young man, lean, short curly hair, bright smile, wearing a red football jersey and denim shorts.",
  SARR:"Cheikh Sarr, a 55-year-old Senegalese man, tall, silver hair, trimmed goatee, calm cold eyes, wearing an impeccable navy three-piece suit and a gold watch."
};

const SHOTS = [
 {id:1,lieu:"Port, nuit",dialogue:[],prompt:"Low-angle wide shot, a cargo container bursts into orange flames at a night port, {MOUSSA} dives behind a crate, sparks flying, camera shake."},
 {id:2,lieu:"Appartement, aube",dialogue:[{perso:"MOUSSA",texte:"Ibou… je te dois la vérité."}],prompt:"Slow push-in close-up, {MOUSSA} holding an old photo of two police officers, dawn light through a window."},
 {id:3,lieu:"Toit, Médina",dialogue:[{perso:"BAMBA",texte:"Patron ! Un conteneur suspect arrive ce soir."}],prompt:"Medium shot on a rooftop, {BAMBA} stops a yellow motorbike and waves urgently at {MOUSSA}, golden morning light."},
 {id:4,lieu:"Toit",dialogue:[{perso:"MOUSSA",texte:"Qui t'a dit ça ?"},{perso:"BAMBA",texte:"Un docker, il avait peur."}],prompt:"Medium two-shot, {MOUSSA} and {BAMBA} facing each other, tense, Dakar rooftops behind them."},
 {id:5,lieu:"Rues de Dakar",dialogue:[],prompt:"Fast tracking shot, {MOUSSA} riding behind {BAMBA} on a motorbike through busy Dakar streets at dusk, motion blur."},
 {id:6,lieu:"Portail du port",dialogue:[{perso:"MOUSSA",texte:"Reste ici. Au moindre bruit, tu pars."}],prompt:"Medium shot at a port fence, {MOUSSA} cutting the wire while {BAMBA} watches nervously, night, harbor lights."},
 {id:7,lieu:"Piles de conteneurs",dialogue:[],prompt:"High-angle shot between towering containers, {MOUSSA} sneaking in the shadows as a searchlight sweeps past."},
 {id:8,lieu:"Conteneur ouvert",dialogue:[{perso:"MOUSSA",texte:"Des faux médicaments… des milliers de boîtes."}],prompt:"Medium close-up, {MOUSSA} opening a crate full of sealed medicine boxes and cash bundles, cold blue light."},
 {id:9,lieu:"Entrepôt",dialogue:[{perso:"VOIX",texte:"Fouillez tout. Il est là."}],prompt:"Wide shot, three silhouettes with flashlights enter the container alley, long shadows, tense atmosphere."},
 {id:10,lieu:"Course",dialogue:[],prompt:"Dynamic tracking shot, {MOUSSA} leaping between container rooftops, men chasing below, night."},
 {id:11,lieu:"Piège",dialogue:[],prompt:"Low-angle shot, {MOUSSA} kicks a lever and a stack of crates tumbles down, dust and debris, dramatic lighting."},
 {id:12,lieu:"Portail",dialogue:[{perso:"BAMBA",texte:"Monte ! Vite, patron !"}],prompt:"Medium shot, {BAMBA} revving the motorbike, {MOUSSA} sprinting toward him, black SUV headlights behind."},
 {id:13,lieu:"Poursuite",dialogue:[],prompt:"Chase shot from behind, motorbike weaving through narrow Medina alleys, two black SUVs pursuing, sparks and neon."},
 {id:14,lieu:"Marché",dialogue:[],prompt:"Slow-motion shot, motorbike jumping over a market stall, mangoes and oranges flying, camera orbiting."},
 {id:15,lieu:"Ruelle",dialogue:[{perso:"AICHA",texte:"Arrêtez de courir. J'ai ce qu'il vous faut."}],prompt:"Medium shot, {AICHA} stepping out of a dark alley holding a camera, {MOUSSA} and {BAMBA} stopping the bike."},
 {id:16,lieu:"Écran d'appareil photo",dialogue:[{perso:"MOUSSA",texte:"C'est Ibou… sur cette photo. Il est vivant."}],prompt:"Over-the-shoulder close-up, a camera screen showing {SARR} shaking hands with a man resembling an older police officer, {MOUSSA} stunned."},
 {id:17,lieu:"Gros plan",dialogue:[],prompt:"Extreme close-up of a phone buzzing on {MOUSSA}'s palm, unknown number, flickering streetlight."},
 {id:18,lieu:"Cliffhanger",dialogue:[{perso:"SARR",texte:"Viens seul, Moussa. Ibou t'attend."}],prompt:"Slow push-in on {MOUSSA}'s shocked face, phone at his ear, shallow depth of field, cut to black."}
];

// --- LOGIQUE ---
const STATE = JSON.parse(localStorage.getItem('dakar_state')) || {};
SHOTS.forEach(s => {
  if (STATE[s.id] === undefined) STATE[s.id] = { done: false };
});

function saveState() {
  localStorage.setItem('dakar_state', JSON.stringify(STATE));
}

function buildPrompt(shot) {
  let p = shot.prompt;
  for (const [k,v] of Object.entries(PERSOS)) {
    p = p.split('{'+k+'}').join(v);
  }
  return `${STYLE}\n\n${p}`;
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.getElementById('toast');
    toast.style.opacity = '1';
    setTimeout(() => { toast.style.opacity = '0'; }, 1500);
  });
}

function toggleDone(id) {
  STATE[id].done = !STATE[id].done;
  saveState();
  render();
}

function render() {
  document.getElementById('shots').innerHTML = SHOTS.map(s => {
    const isDone = STATE[s.id].done;
    const imgPrompt = buildPrompt(s);
    const dlgText = s.dialogue.map(d => `${d.perso}: ${d.texte}`).join('\n');
    
    return `
    <div class="card ${isDone ? 'is-done' : ''}">
      <div class="header-row">
        <div>
          <div class="title">Plan ${s.id}</div>
          <div class="lieu">${s.lieu}</div>
        </div>
      </div>

      <div class="section-title">1. Prompt Image (Agnes / Midjourney)</div>
      <div class="prompt-box">
        ${imgPrompt}
        <button class="btn-copy" onclick="copyText(\`${imgPrompt.replace(/`/g, '\\`')}\`)">Copier</button>
      </div>

      <div class="section-title">2. Prompt Vidéo (Image-to-Video)</div>
      <div class="prompt-box">
        ${imgPrompt}
        <button class="btn-copy" onclick="copyText(\`${imgPrompt.replace(/`/g, '\\`')}\`)">Copier</button>
      </div>

      ${dlgText ? `
      <div class="section-title">3. Dialogue (Pour CapCut / TTS)</div>
      <div class="dialogue-box">
        ${dlgText.replace(/\n/g, '<br>')}
        <button class="btn-copy" onclick="copyText(\`${dlgText.replace(/`/g, '\\`')}\`)">Copier</button>
      </div>
      ` : ''}

      <div class="checkbox-row" onclick="toggleDone(${s.id})">
        <input type="checkbox" ${isDone ? 'checked' : ''} onclick="event.stopPropagation(); toggleDone(${s.id})">
        <span>Scène générée et téléchargée</span>
      </div>
    </div>
    `;
  }).join('');
}

render();
</script>
</body>
</html>
