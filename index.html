<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1216">
<title>Dakar Studio</title>
<style>
  :root { --bg:#0f1216; --card:#1a1f26; --fg:#e8ecf1; --muted:#8a93a0;
          --accent:#ff8a3d; --ok:#2fbf71; --err:#e5484d; --warn:#f5a524; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0 auto; padding:16px 12px 90px; max-width:720px;
         font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px; }
  input, button { font:inherit; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid #2a313b;
          background:#0b0e12; color:var(--fg); }
  button { border:0; border-radius:10px; padding:12px 16px; background:var(--accent);
           color:#111; font-weight:600; cursor:pointer; }
  button.secondary { background:#2a313b; color:var(--fg); }
  button:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .shot { display:flex; gap:10px; padding:10px 0; border-bottom:1px solid #252b33; }
  .shot:last-child { border:0; }
  .thumb { width:64px; height:114px; background:#0b0e12; border-radius:8px;
           flex-shrink:0; object-fit:cover; border:1px solid #2a313b; }
  .info { flex:1; min-width:0; }
  .info b { font-size:14px; }
  .lieu { color:var(--muted); font-size:12px; margin-top:2px; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px;
           border-radius:999px; margin-top:6px; }
  .s-pending { background:#2a313b; color:var(--muted); }
  .s-image   { background:#3a2e1a; color:var(--warn); }
  .s-video   { background:#1a2a1f; color:var(--ok); }
  .s-done    { background:#1a2a1f; color:var(--ok); }
  .s-error   { background:#3a1a1c; color:var(--err); }
  .actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .actions button { padding:8px 12px; font-size:13px; }
  #log { font-family:ui-monospace,monospace; font-size:11px; color:var(--muted);
         max-height:110px; overflow:auto; background:#0b0e12;
         border-radius:8px; padding:8px; margin-top:8px; white-space:pre-wrap; }
  .sticky { position:fixed; bottom:0; left:0; right:0; padding:12px;
            background:linear-gradient(transparent,var(--bg) 30%); z-index:10; }
  .sticky-inner { display:flex; gap:8px; max-width:720px; margin:0 auto; }
  .sticky button { flex:1; }
</style>
</head>
<body>
<header>
  <h1>🎬 Dakar Studio</h1>
  <div class="sub">Épisode 1 · Le Port · 18 plans · vertical 9:16</div>
</header>

<section class="card">
  <label style="font-size:13px;color:var(--muted)">Clé API Agnes</label>
  <div class="row" style="margin-top:8px">
    <input id="key" type="password" placeholder="colle ta clé ici" style="flex:1">
    <button class="secondary" onclick="saveKey()">OK</button>
  </div>
  <div id="keyStatus" style="font-size:12px;color:var(--muted);margin-top:6px"></div>
</section>

<section class="card">
  <div class="row">
    <button id="btnAll" onclick="generateAll()">▶ Générer tout</button>
    <button class="secondary" id="btnRetry" onclick="retryErrors()" style="display:none">↻ Réessayer les erreurs</button>
  </div>
  <div id="log">prêt. (Garde l'écran allumé pendant la génération)</div>
</section>

<section id="shots"></section>

<div class="sticky"><div class="sticky-inner">
  <button onclick="downloadAll()">⬇ Télécharger tous les clips prêts</button>
</div></div>

<script>
const STYLE = "STYLE: Stylized 3D animated render, cinematic action-film look with expressive faces, soft volumetric lighting and shallow depth of field. Warm Dakar palette of sunset orange, teal shadows and deep indigo night, vertical 9:16 framing.";
const PERSOS = {
  MOUSSA:"Moussa, a 45-year-old Senegalese man, broad shoulders, short grey-flecked beard, small scar over left eyebrow, wearing a worn olive jacket over a white t-shirt and dark jeans.",
  AICHA:"Aicha, a 26-year-old Senegalese woman, oval face, braided hair in a high bun, round glasses, wearing a mustard-yellow jacket with a camera strap across her chest.",
  BAMBA:"Bamba, a 19-year-old Senegalese young man, lean, short curly hair, bright smile, wearing a red football jersey and denim shorts.",
  SARR:"Cheikh Sarr, a 55-year-old Senegalese man, tall, silver hair, trimmed goatee, calm cold eyes, wearing an impeccable navy three-piece suit and a gold watch."
};
const SHOTS = [
 {id:1,lieu:"Port, nuit",dialogue:[],prompt:"Low-angle wide shot, a cargo container bursts into orange flames at a night port, {MOUSSA} dives behind a crate, sparks flying, camera shake."},
 {id:2,lieu:"Appartement, aube",dialogue:[{perso:"MOUSSA",texte:"Ibou… je te dois la vérité."}],prompt:"Slow push-in close-up, {MOUSSA} holding an old photo of two police officers, dawn light through a window."},
 {id:3,lieu:"Toit, Médina",dialogue:[{perso:"BAMBA",texte:"Patron ! Un conteneur suspect arrive ce soir."}],prompt:"Medium shot on a rooftop, {BAMBA} stops a yellow motorbike and waves urgently at {MOUSSA}, golden morning light."},
 {id:4,lieu:"Toit",dialogue:[{perso:"MOUSSA",texte:"Qui t'a dit ça ?"},{perso:"BAMBA",texte:"Un docker, il avait peur."}],prompt:"Medium two-shot, {MOUSSA} and {BAMBA} facing each other, tense, Dakar rooftops behind them."},
 {id:5,lieu:"Rues de Dakar",dialogue:[],prompt:"Fast tracking shot, {MOUSSA} riding behind {BAMBA} on a motorbike through busy Dakar streets at dusk, motion blur."},
 {id:6,lieu:"Portail du port",dialogue:[{perso:"MOUSSA",texte:"Reste ici. Au moindre bruit, tu pars."}],prompt:"Medium shot at a port fence, {MOUSSA} cutting the wire while {BAMBA} watches nervously, night, harbor lights."},
 {id:7,lieu:"Piles de conteneurs",dialogue:[],prompt:"High-angle shot between towering containers, {MOUSSA} sneaking in the shadows as a searchlight sweeps past."},
 {id:8,lieu:"Conteneur ouvert",dialogue:[{perso:"MOUSSA",texte:"Des faux médicaments… des milliers de boîtes."}],prompt:"Medium close-up, {MOUSSA} opening a crate full of sealed medicine boxes and cash bundles, cold blue light."},
 {id:9,lieu:"Entrepôt",dialogue:[{perso:"VOIX",texte:"Fouillez tout. Il est là."}],prompt:"Wide shot, three silhouettes with flashlights enter the container alley, long shadows, tense atmosphere."},
 {id:10,lieu:"Course",dialogue:[],prompt:"Dynamic tracking shot, {MOUSSA} leaping between container rooftops, men chasing below, night."},
 {id:11,lieu:"Piège",dialogue:[],prompt:"Low-angle shot, {MOUSSA} kicks a lever and a stack of crates tumbles down, dust and debris, dramatic lighting."},
 {id:12,lieu:"Portail",dialogue:[{perso:"BAMBA",texte:"Monte ! Vite, patron !"}],prompt:"Medium shot, {BAMBA} revving the motorbike, {MOUSSA} sprinting toward him, black SUV headlights behind."},
 {id:13,lieu:"Poursuite",dialogue:[],prompt:"Chase shot from behind, motorbike weaving through narrow Medina alleys, two black SUVs pursuing, sparks and neon."},
 {id:14,lieu:"Marché",dialogue:[],prompt:"Slow-motion shot, motorbike jumping over a market stall, mangoes and oranges flying, camera orbiting."},
 {id:15,lieu:"Ruelle",dialogue:[{perso:"AICHA",texte:"Arrêtez de courir. J'ai ce qu'il vous faut."}],prompt:"Medium shot, {AICHA} stepping out of a dark alley holding a camera, {MOUSSA} and {BAMBA} stopping the bike."},
 {id:16,lieu:"Écran d'appareil photo",dialogue:[{perso:"MOUSSA",texte:"C'est Ibou… sur cette photo. Il est vivant."}],prompt:"Over-the-shoulder close-up, a camera screen showing {SARR} shaking hands with a man resembling an older police officer, {MOUSSA} stunned."},
 {id:17,lieu:"Gros plan",dialogue:[],prompt:"Extreme close-up of a phone buzzing on {MOUSSA}'s palm, unknown number, flickering streetlight."},
 {id:18,lieu:"Cliffhanger",dialogue:[{perso:"SARR",texte:"Viens seul, Moussa. Ibou t'attend."}],prompt:"Slow push-in on {MOUSSA}'s shocked face, phone at his ear, shallow depth of field, cut to black."}
];

const STATE = {};
SHOTS.forEach(s => STATE[s.id] = { status:'pending' });

const sleep = ms => new Promise(r => setTimeout(r, ms));
const log = m => {
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString();
  el.textContent = `[${t}] ${m}\n` + el.textContent;
  checkErrors();
};
const blobToB64 = blob => new Promise(res => {
  const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]);
  r.readAsDataURL(blob);
});
const b64ToBlob = (b64, type='image/png') => {
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type});
};

function saveKey() {
  const k = document.getElementById('key').value.trim();
  if (k) { localStorage.setItem('agnes_key', k); refreshKeyStatus(); }
}
function refreshKeyStatus() {
  const k = localStorage.getItem('agnes_key');
  document.getElementById('keyStatus').textContent =
    k ? `✓ clé enregistrée (${k.slice(0,6)}…)` : '⚠️ aucune clé enregistrée';
}

async function api(path, body, method='POST', retries=2) {
  const key = localStorage.getItem('agnes_key');
  if (!key) throw new Error('clé API manquante');
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await fetch(`https://apihub.agnes-ai.com/v1${path}`, {
        method,
        headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      
      if (res.status === 429) {
        log(`⏳ Limite atteinte. Pause de 60s...`);
        await sleep(60000);
        continue;
      }
      
      if (!res.ok) {
        const errText = await res.text();
        // Si le serveur vidéo est down (erreur 500), on attend 10s et on réessaie
        if (res.status >= 500 && attempt < retries) {
          log(`⚠️ Serveur Agnes occupé (500). Nouvelle tentative dans 10s...`);
          await sleep(10000);
          continue;
        }
        throw new Error(`${res.status} · ${errText.slice(0,100)}`);
      }
      
      return await res.json();
    } catch (e) {
      if (e.message.includes('Failed to fetch') && attempt < retries) {
        log(`⚠️ Erreur réseau. Nouvelle tentative dans 5s...`);
        await sleep(5000);
        continue;
      }
      throw e;
    }
  }
}

function buildPrompt(shot) {
  let p = shot.prompt;
  for (const [k,v] of Object.entries(PERSOS))
    p = p.split('{'+k+'}').join(v);
  return `${STYLE}\n\n${p}`;
}

async function genImage(shot) {
  const st = STATE[shot.id];
  st.status = 'image'; st.error = null; render();
  try {
    const d = await api('/images/generations', {
      model: 'agnes-image-2.1-flash',
      prompt: buildPrompt(shot),
      size: '720x1280', n: 1, response_format: 'b64_json'
    });
    const item = d.data[0];
    const blob = item.b64_json
      ? b64ToBlob(item.b64_json)
      : await (await fetch(item.url)).blob();
    st.imageBlob = blob;
    st.imageUrl = URL.createObjectURL(blob);
    log(`✓ image plan ${shot.id}`);
    render();
    return true;
  } catch(e) {
    st.status = 'error'; st.error = e.message;
    log(`✗ image ${shot.id} : ${e.message}`);
    render();
    return false;
  }
}

async function genVideo(shot) {
  const st = STATE[shot.id];
  st.status = 'video'; render();
  try {
    const imgB64 = await blobToB64(st.imageBlob);
    const job = await api('/videos', {
      model: 'agnes-video-v2.0',
      prompt: buildPrompt(shot),
      image: `data:image/png;base64,${imgB64}`,
      width: 720, height: 1280, num_frames: 121, fps: 24
    });
    const id = job.video_id || job.id;
    log(`⏳ vidéo plan ${shot.id} en file d'attente...`);
    let tries = 0;
    while (tries < 20) {
      await sleep(60000); // 1 check par minute
      const d = await api(`/videos/${id}`, null, 'GET', 1);
      const s = (d.status || '').toLowerCase();
      if (['succeeded','completed','done','ready'].includes(s)) {
        const url = d.url || d.video_url || (d.output && d.output.url);
        const blob = await (await fetch(url)).blob();
        st.videoBlob = blob;
        st.videoUrl = URL.createObjectURL(blob);
        st.status = 'done';
        log(`✓ vidéo plan ${shot.id} terminée !`);
        render();
        return true;
      }
      if (['failed','error'].includes(s)) throw new Error('tâche échouée');
      tries++;
      if (tries % 2 === 0) log(`… plan ${shot.id} toujours en cours de rendu...`);
    }
    throw new Error('délai dépassé');
  } catch(e) {
    st.status = 'error'; st.error = e.message;
    log(`✗ vidéo ${shot.id} : ${e.message}`);
    render();
    return false;
  }
}

async function runShot(shot) {
  const st = STATE[shot.id];
  if (!st.imageBlob) { if (!(await genImage(shot))) return; }
  await sleep(3000); // Petite pause pour éviter le 429
  await genVideo(shot);
}

async function generateAll() {
  const btn = document.getElementById('btnAll');
  btn.disabled = true; btn.textContent = '⏳ en cours…';
  for (const shot of SHOTS) {
    if (STATE[shot.id].status === 'done') continue;
    await runShot(shot);
    await sleep(5000); // Pause de 5s entre chaque plan
  }
  btn.disabled = false; btn.textContent = '▶ Générer tout';
  log('🏁 Terminé.');
}

async function retryErrors() {
  const btn = document.getElementById('btnRetry');
  btn.disabled = true; btn.textContent = '⏳...';
  const errors = SHOTS.filter(s => STATE[s.id].status === 'error');
  log(`↻ Relance de ${errors.length} plans en erreur...`);
  for (const shot of errors) {
    await runShot(shot);
    await sleep(5000);
  }
  btn.disabled = false; btn.textContent = '↻ Réessayer les erreurs';
}

function checkErrors() {
  const hasErrors = Object.values(STATE).some(s => s.status === 'error');
  document.getElementById('btnRetry').style.display = hasErrors ? 'block' : 'none';
}

function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function downloadShot(shot) {
  const st = STATE[shot.id];
  const n = `ep01_plan_${String(shot.id).padStart(2,'0')}`;
  if (st.videoBlob) download(st.videoBlob, n + '.mp4');
  else if (st.imageBlob) download(st.imageBlob, n + '.png');
}
async function downloadAll() {
  for (const shot of SHOTS) {
    if (STATE[shot.id].videoBlob) {
      downloadShot(shot);
      await sleep(1000);
    }
  }
}

function render() {
  document.getElementById('shots').innerHTML = SHOTS.map(s => {
    const st = STATE[s.id];
    const label = {pending:'en attente', image:'image générée', video:'vidéo en cours…',
                   done:'prêt', error:'erreur'}[st.status] || st.status;
    const media = st.videoUrl
      ? `<video class="thumb" src="${st.videoUrl}" controls muted playsinline></video>`
      : st.imageUrl
        ? `<img class="thumb" src="${st.imageUrl}">`
        : `<div class="thumb" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px">plan ${s.id}</div>`;
    const dlg = s.dialogue.map(d => `${d.perso}: « ${d.texte} »`).join(' · ') || '(sans dialogue)';
    const err = st.error ? ' · ' + st.error.slice(0,40) + '...' : '';
    return `<div class="card shot">
      ${media}
      <div class="info">
        <b>Plan ${s.id} · ${s.lieu}</b>
        <div class="lieu">${dlg}</div>
        <span class="badge s-${st.status}">${label}${err}</span>
        <div class="actions">
          <button onclick="runShot(SHOTS[${s.id-1}])">${st.status==='done'?'↻ régénérer':'▶ générer'}</button>
          ${st.videoBlob||st.imageBlob
            ? `<button class="secondary" onclick="downloadShot(SHOTS[${s.id-1}])">⬇ télécharger</button>`
            : ''}
        </div>
      </div>
    </div>`;
  }).join('');
  checkErrors();
}

refreshKeyStatus();
render();
</script>
</body>
</html>
